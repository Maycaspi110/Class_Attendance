{% extends "base.html" %}
{% block title %}Student login{% endblock %}
{% block body %}
<a class="homelink" href="{{ url_for('home') }}">&larr; Home</a>
<h1>Student login</h1>
<p class="sub">Enter the email you are registered with in the course.</p>
<form class="card" method="post" action="">
  <label>Email
    <input type="email" name="email" autocomplete="email" autofocus required>
  </label>
  {% if error %}<div class="msg bad">{{ error }}</div>{% endif %}
  <button type="submit">Log in</button>
</form>
{% endblock %}
