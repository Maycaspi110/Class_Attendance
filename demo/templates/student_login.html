{% extends "base.html" %}
{% block title %}Student login{% endblock %}
{% block body %}
<a class="homelink" href="{{ url_for('home') }}">&larr; Home</a>
<h1>Student login</h1>
<p class="sub">Enter your name and the code you were given.</p>
<form class="card" method="post" action="">
  <label>Name
    <input type="text" name="name" autocomplete="name" autofocus required>
  </label>
  <label>Code
    <input type="password" name="password" inputmode="numeric" autocomplete="off" required>
  </label>
  {% if error %}<div class="msg bad">{{ error }}</div>{% endif %}
  <button type="submit">Log in</button>
</form>
{% endblock %}
